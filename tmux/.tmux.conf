# ── Prefix ────────────────────────────────────────────────────
# Ctrl-a is easier to reach than the default Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────
set -g status-position top       # windows as tabs at top
set -g mouse on                  # click to focus panes/windows, scroll
set -g set-clipboard on
set -g base-index 1              # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on       # fill gaps when a window is closed
set -g automatic-rename off      # keep the name you give a window

# ── Colors ────────────────────────────────────────────────────
set -g default-terminal "ghostty"
set -ga terminal-overrides ",ghostty:Tc"

# ── Reload config ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# ── Splits & windows ──────────────────────────────────────────
unbind '"'
unbind %
bind c new-window -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ── Window navigation ─────────────────────────────────────────
bind w choose-tree -Zw                              # fuzzy picker: sessions + windows + panes
bind , command-prompt -I "#W" "rename-window '%%'"  # quick rename current window
bind -n S-Left  previous-window                     # Shift+arrow (no prefix)
bind -n S-Right next-window
bind -n M-H previous-window                         # Alt+Shift+H/L (no prefix)
bind -n M-L next-window

# ── Pane navigation ───────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left  select-pane -L                      # Option+arrow (no prefix)
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Cmd key bindings (via Ghostty Unicode passthrough) ─────────
# Ghostty maps Cmd+key → Unicode character → tmux binds the character
bind-key -n ç new-window -n "zsh" -c "#{pane_current_path}"  # Cmd+N
bind-key -n ¬ next-window                            # Cmd+Shift+]
bind-key -n ˙ previous-window                        # Cmd+Shift+[
bind-key -n ≈ kill-window                            # Cmd+U

# ── Copy mode (vi) ─────────────────────────────────────────────
set -g mode-keys vi
bind-key -T copy-mode-vi v   send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "pbcopy"

# ── Pane sync toggle ───────────────────────────────────────────
# Useful when running the same command across multiple Docker project panes
bind m setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,on,off}"

# ── Popups ────────────────────────────────────────────────────
set -g @popup_w "95%"
set -g @popup_h "90%"

# Claude Code popup — Cmd+P opens/closes a floating Claude session
set-environment -g LLM_ASSISTANT "claude"
bind -n '▸' run-shell "~/tmux-scripts/llm-popup-toggle.sh '#{pane_current_path}' '#{session_name}' '#{window_name}' '#{@popup_w}' '#{@popup_h}'"

# Quick shell popup — Cmd+O for a floating shell without leaving your current window
bind -n '⌁' run-shell "~/tmux-scripts/shell-popup.sh '#{pane_current_path}' '#{session_name}' '#{window_name}' '#{@popup_w}' '#{@popup_h}'"

# ── Plugins ────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'
if-shell '[ "$(uname)" = "Darwin" ]' {
  bind o run-shell "/opt/homebrew/bin/bash ~/.tmux/plugins/tmux-sessionx/scripts/sessionx.sh"
}
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_cpu_text " #(~/.tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh)"
set -g @catppuccin_date_time_text " %a %m/%d/%Y %I:%M %p %Z"
set -g @catppuccin_battery_icon "#(~/.tmux/plugins/tmux-battery/scripts/battery_icon.sh) "
set -g @catppuccin_battery_text " #(~/.tmux/plugins/tmux-battery/scripts/battery_percentage.sh)"

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_cpu}#{E:@catppuccin_status_battery}#{E:@catppuccin_status_date_time}"

run '~/.tmux/plugins/tpm/tpm'
